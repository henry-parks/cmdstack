[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdstack"
version = "0.1.0"
description = "Stack millions of process command lines into a few hundred reviewable groups, locally."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Henry Parks" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "duckdb>=1.0",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
    "fast_hdbscan>=0.2",
    "sentence-transformers>=2.6",
    "openpyxl>=3.1",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/henry-parks/cmdstack"

[project.scripts]
cmdstack = "cmdstack.cli:main"

[tool.setuptools.packages.find]
include = ["cmdstack*"]
